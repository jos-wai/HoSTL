<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Citas - RegHost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            padding: 2rem;
        }
        .header-section {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            color: white;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            text-align: center;
        }
        .btn-custom {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            border: none;
            border-radius: 25px;
            padding: 0.75rem 2rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: white;
        }
        .btn-menu {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 0.75rem 2rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-menu:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            color: white;
        }
        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        .table th {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            color: white;
            border: none;
            padding: 1rem 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            white-space: nowrap;
        }
        .table td {
            padding: 0.75rem 0.5rem;
            vertical-align: middle;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.875rem;
        }
        .table tbody tr:hover {
            background-color: #f8f7ff;
            transform: scale(1.01);
            transition: all 0.3s ease;
        }
        .btn-action {
            border-radius: 15px;
            padding: 0.4rem 0.8rem;
            margin: 0 0.1rem;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }
        .btn-edit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-delete {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border: none;
            color: #dc3545;
        }
        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            color: #dc3545;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .badge-custom {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
        }
        .cita-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .cita-name {
            font-weight: 600;
            color: #495057;
        }
        .cita-detail {
            font-size: 0.75rem;
            color: #6c757d;
        }
        .estado-programada {
            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
            color: white;
        }
        .estado-confirmada {
            background: linear-gradient(135deg, #1dd1a1 0%, #55a3ff 100%);
            color: white;
        }
        .estado-completada {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            color: white;
        }
        .estado-cancelada {
            background: linear-gradient(135deg, #ee5a6f 0%, #f29263 100%);
            color: white;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="main-container">
        <div class="header-section">
            <h1><i class="fas fa-calendar-check me-3"></i>Gestión de Citas Médicas</h1>
            <p class="mb-0">Control de citas y consultas programadas</p>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-dark mb-0">
                <i class="fas fa-list me-2"></i>Lista de Citas
            </h2>
            <div>
                <a th:href="@{/citas/nuevo}" class="btn-custom me-2">
                    <i class="fas fa-plus me-2"></i>Nueva Cita
                </a>
                <a th:href="@{/menu}" class="btn-menu">
                    <i class="fas fa-home me-2"></i>Menú Principal
                </a>
            </div>
        </div>

        <div class="table-container" th:if="${not #lists.isEmpty(listaCitas)}">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th><i class="fas fa-hashtag me-1"></i>ID</th>
                    <th><i class="fas fa-user-injured me-1"></i>Paciente</th>
                    <th><i class="fas fa-user-md me-1"></i>Doctor</th>
                    <th><i class="fas fa-calendar me-1"></i>Fecha y Hora</th>
                    <th><i class="fas fa-stethoscope me-1"></i>Especialidad</th>
                    <th><i class="fas fa-notes-medical me-1"></i>Motivo</th>
                    <th><i class="fas fa-info-circle me-1"></i>Estado</th>
                    <th><i class="fas fa-phone me-1"></i>Teléfono</th>
                    <th><i class="fas fa-cogs me-1"></i>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cita : ${listaCitas}">
                    <td th:text="${cita.id}" class="fw-bold"></td>
                    <td>
                        <span class="cita-name" th:text="${cita.nombrePaciente}"></span>
                    </td>
                    <td>
                        <div class="cita-info">
                            <span class="cita-name" th:text="${cita.nombreDoctor}"></span>
                            <span class="cita-detail" th:text="${cita.especialidad}"></span>
                        </div>
                    </td>
                    <td>
                        <div class="cita-info">
                            <span class="cita-detail" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy')}"></span>
                            <span class="cita-detail" th:text="${#temporals.format(cita.fechaHora, 'HH:mm')}"></span>
                        </div>
                    </td>
                    <td>
                        <span class="badge bg-primary badge-custom" th:text="${cita.especialidad}"></span>
                    </td>
                    <td>
                        <span class="cita-detail" th:text="${cita.motivo}"></span>
                    </td>
                    <td>
                        <span class="badge badge-custom"
                              th:classappend="${cita.estado == 'Programada'} ? 'estado-programada' :
                                             (${cita.estado == 'Confirmada'} ? 'estado-confirmada' :
                                             (${cita.estado == 'Completada'} ? 'estado-completada' : 'estado-cancelada'))"
                              th:text="${cita.estado}"></span>
                    </td>
                    <td th:text="${cita.telefono}"></td>
                    <td>
                        <a th:href="@{'/citas/editar/' + ${cita.id}}" class="btn btn-edit btn-action">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{'/citas/eliminar/' + ${cita.id}}"
                           class="btn btn-delete btn-action"
                           onclick="return confirm('¿Está seguro de eliminar esta cita?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(listaCitas)}">
            <i class="fas fa-calendar-check"></i>
            <h3>No hay citas registradas</h3>
            <p>Comience agregando la primera cita al sistema</p>
            <a th:href="@{/citas/nuevo}" class="btn-custom mt-3">
                <i class="fas fa-plus me-2"></i>Agregar Primera Cita
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
