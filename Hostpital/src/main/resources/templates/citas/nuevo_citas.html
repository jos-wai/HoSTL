<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Cita - RegHost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            padding: 2rem;
            max-width: 800px;
        }
        .header-section {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            color: white;
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            text-align: center;
        }
        .form-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid #5f27cd;
        }
        .form-floating {
            margin-bottom: 1.5rem;
        }
        .form-control, .form-select {
            border-radius: 15px;
            border: 2px solid #e9ecef;
            padding: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #5f27cd;
            box-shadow: 0 0 0 0.2rem rgba(95, 39, 205, 0.25);
        }
        .btn-custom {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            border: none;
            border-radius: 25px;
            padding: 0.75rem 2rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: white;
        }
        .btn-secondary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 0.75rem 2rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-secondary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            color: white;
        }
        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <div class="header-section">
            <h1><i class="fas fa-calendar-plus me-3"></i>Nueva Cita Médica</h1>
            <p class="mb-0">Programe una nueva cita médica</p>
        </div>

        <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
            <div class="form-section">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="nombrePaciente" th:field="*{nombrePaciente}"
                                   placeholder="Nombre del paciente" required>
                            <label for="nombrePaciente"><i class="fas fa-user me-2"></i>Nombre del Paciente</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="nombreDoctor" th:field="*{nombreDoctor}"
                                   placeholder="Nombre del doctor" required>
                            <label for="nombreDoctor"><i class="fas fa-user-md me-2"></i>Nombre del Doctor</label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="datetime-local" class="form-control" id="fechaHora" th:field="*{fechaHora}" required>
                            <label for="fechaHora"><i class="fas fa-clock me-2"></i>Fecha y Hora</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="especialidad" th:field="*{especialidad}" required>
                                <option value="">Seleccione especialidad</option>
                                <option value="Medicina General">Medicina General</option>
                                <option value="Cardiología">Cardiología</option>
                                <option value="Neurología">Neurología</option>
                                <option value="Pediatría">Pediatría</option>
                                <option value="Ginecología">Ginecología</option>
                                <option value="Traumatología">Traumatología</option>
                                <option value="Oncología">Oncología</option>
                                <option value="Dermatología">Dermatología</option>
                                <option value="Oftalmología">Oftalmología</option>
                                <option value="Urología">Urología</option>
                            </select>
                            <label for="especialidad"><i class="fas fa-stethoscope me-2"></i>Especialidad</label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="motivo" th:field="*{motivo}"
                                   placeholder="Motivo de la cita" required>
                            <label for="motivo"><i class="fas fa-notes-medical me-2"></i>Motivo de la Cita</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="estado" th:field="*{estado}" required>
                                <option value="">Seleccione estado</option>
                                <option value="Programada">Programada</option>
                                <option value="Confirmada">Confirmada</option>
                                <option value="Completada">Completada</option>
                                <option value="Cancelada">Cancelada</option>
                            </select>
                            <label for="estado"><i class="fas fa-info-circle me-2"></i>Estado</label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="tel" class="form-control" id="telefono" th:field="*{telefono}"
                                   placeholder="Teléfono de contacto" pattern="[0-9]{9}" maxlength="9" required>
                            <label for="telefono"><i class="fas fa-phone me-2"></i>Teléfono</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <textarea class="form-control" id="observaciones" th:field="*{observaciones}"
                                      placeholder="Observaciones adicionales"></textarea>
                            <label for="observaciones"><i class="fas fa-comment me-2"></i>Observaciones</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn-custom">
                    <i class="fas fa-save me-2"></i>Guardar Cita
                </button>
                <a th:href="@{/citas/}" class="btn-secondary-custom">
                    <i class="fas fa-arrow-left me-2"></i>Volver a la Lista
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
