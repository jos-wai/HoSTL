<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Habitación - RegHost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body{background:linear-gradient(135deg,#ff9ff3 0%,#feca57 100%);min-height:100vh;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}.form-container{background:rgba(255,255,255,.95);border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.1);backdrop-filter:blur(10px);margin:2rem auto;padding:2rem;max-width:800px}.header-section{background:linear-gradient(135deg,#ff9ff3 0%,#feca57 100%);color:#2c3e50;padding:2rem;border-radius:15px;margin-bottom:2rem;text-align:center}.form-section{background:#f8f9fa;border-radius:15px;padding:1.5rem;margin-bottom:2rem;border-left:4px solid #ff9ff3}.form-floating{margin-bottom:1.5rem}.form-control,.form-select{border-radius:15px;border:2px solid #e9ecef;padding:1rem;transition:all .3s ease}.form-control:focus,.form-select:focus{border-color:#ff9ff3;box-shadow:0 0 0 .2rem rgba(255,159,243,.25)}.btn-custom{background:linear-gradient(135deg,#ff9ff3 0%,#feca57 100%);border:none;border-radius:25px;padding:.75rem 2rem;color:#2c3e50;font-weight:600;transition:all .3s ease;width:100%;margin-bottom:1rem}.btn-custom:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,.2);color:#2c3e50}.btn-secondary-custom{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border:none;border-radius:25px;padding:.75rem 2rem;color:#fff;font-weight:600;transition:all .3s ease;width:100%;text-decoration:none;display:inline-block;text-align:center}.btn-secondary-custom:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,.1);color:#fff}textarea.form-control{min-height:100px;resize:vertical}
    </style>
</head>
<body>
<div class="container">
    <div class="form-container">
        <div class="header-section">
            <h1><i class="fas fa-bed-plus me-3"></i>Nueva Habitación</h1>
            <p class="mb-0">Registre una nueva habitación en el sistema</p>
        </div>
        <form th:action="@{/habitaciones/guardar}" th:object="${habitacion}" method="post">
            <div class="form-section">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="numeroHabitacion" th:field="*{numeroHabitacion}" placeholder="Número de habitación" required>
                            <label for="numeroHabitacion"><i class="fas fa-door-open me-2"></i>Número de Habitación</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <select class="form-select" id="tipo" th:field="*{tipo}" required>
                                <option value="">Seleccione tipo</option>
                                <option value="Individual">Individual</option>
                                <option value="Doble">Doble</option>
                                <option value="Triple">Triple</option>
                                <option value="Suite">Suite</option>
                                <option value="UCI">UCI</option>
                                <option value="Emergencia">Emergencia</option>
                            </select>
                            <label for="tipo"><i class="fas fa-building me-2"></i>Tipo de Habitación</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="piso" th:field="*{piso}" placeholder="Piso" required>
                            <label for="piso"><i class="fas fa-layer-group me-2"></i>Piso</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-floating">
                            <select class="form-select" id="estado" th:field="*{estado}" required>
                                <option value="">Seleccione estado</option>
                                <option value="Disponible">Disponible</option>
                                <option value="Ocupada">Ocupada</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                                <option value="Limpieza">Limpieza</option>
                            </select>
                            <label for="estado"><i class="fas fa-info-circle me-2"></i>Estado</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-floating">
                            <input type="number" class="form-control" id="capacidad" th:field="*{capacidad}" placeholder="Capacidad" min="1" max="10" required>
                            <label for="capacidad"><i class="fas fa-users me-2"></i>Capacidad</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="pacienteAsignado" th:field="*{pacienteAsignado}" placeholder="Paciente asignado">
                            <label for="pacienteAsignado"><i class="fas fa-user-injured me-2"></i>Paciente Asignado (Opcional)</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="date" class="form-control" id="fechaAsignacion" th:field="*{fechaAsignacion}">
                            <label for="fechaAsignacion"><i class="fas fa-calendar me-2"></i>Fecha de Asignación</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input type="number" step="0.01" class="form-control" id="precioNoche" th:field="*{precioNoche}" placeholder="Precio por noche" required>
                            <label for="precioNoche"><i class="fas fa-dollar-sign me-2"></i>Precio por Noche (S/.)</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <textarea class="form-control" id="equipamiento" th:field="*{equipamiento}" placeholder="Equipamiento"></textarea>
                            <label for="equipamiento"><i class="fas fa-tools me-2"></i>Equipamiento</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-floating">
                            <textarea class="form-control" id="observaciones" th:field="*{observaciones}" placeholder="Observaciones"></textarea>
                            <label for="observaciones"><i class="fas fa-comment me-2"></i>Observaciones</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn-custom"><i class="fas fa-save me-2"></i>Guardar Habitación</button>
                <a th:href="@{/habitaciones/}" class="btn-secondary-custom"><i class="fas fa-arrow-left me-2"></i>Volver a la Lista</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
